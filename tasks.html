<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Reminders - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="timetable.html"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html" class="active"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <h4 class="fw-bold mb-4"><i class="bi bi-check2-square text-success"></i> Task Reminders</h4>

            <div class="chart-card p-3 p-md-4 mb-4">
                <form id="taskForm" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control" id="taskName" placeholder="Task name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="date" class="form-control" id="taskDue" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-success w-100"><i class="bi bi-plus-lg"></i> Add Task</button>
                    </div>
                </form>
            </div>

            <div id="taskList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        var tasks = [];

        async function init() {
            await checkLogin();
            tasks = (await apiRequest("/api/tasks")) || [];
            renderTasks();
        }

        function renderTasks() {
            var taskList = document.getElementById("taskList");
            taskList.innerHTML = "";

            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, "0");
            var day = String(now.getDate()).padStart(2, "0");
            var today = year + "-" + month + "-" + day;

            for (var i = 0; i < tasks.length; i++) {
                var task = tasks[i];
                var statusBadge = "";

                if (task.done) {
                    statusBadge = '<span class="badge bg-success me-2">Completed</span>';
                } else if (task.due < today) {
                    statusBadge = '<span class="badge bg-danger me-2">Overdue</span>';
                } else {
                    statusBadge = '<span class="badge bg-warning text-dark me-2">Pending</span>';
                }

                var completeBtn = "";
                if (!task.done) {
                    completeBtn = '<button class="btn btn-outline-success btn-sm me-2" onclick="toggleTask(\'' + task._id + '\', true)"><i class="bi bi-check-lg"></i></button>';
                } else {
                    completeBtn = '<button class="btn btn-outline-secondary btn-sm me-2" onclick="toggleTask(\'' + task._id + '\', false)"><i class="bi bi-arrow-counterclockwise"></i></button>';
                }
                var deleteBtn = '<button class="btn btn-outline-danger btn-sm" onclick="deleteTask(\'' + task._id + '\')"><i class="bi bi-trash"></i></button>';

                var card = document.createElement("div");
                card.className = "card mb-2 shadow-sm";
                card.innerHTML = '<div class="card-body d-flex justify-content-between align-items-center">' +
                    '<div>' +
                        '<strong class="' + (task.done ? 'task-done' : '') + '">' + task.name + '</strong>' +
                        '<small class="text-muted d-block">Due: ' + task.due + '</small>' +
                    '</div>' +
                    '<div class="d-flex align-items-center">' +
                        statusBadge +
                        completeBtn +
                        deleteBtn +
                    '</div>' +
                '</div>';

                taskList.appendChild(card);
            }
        }

        async function toggleTask(id, done) {
            try {
                await apiRequest("/api/tasks/" + id, "PUT", { done: done });
                tasks = (await apiRequest("/api/tasks")) || [];
                renderTasks();
            } catch (err) {
                alert(err.message || "Failed to update task.");
            }
        }

        async function deleteTask(id) {
            try {
                await apiRequest("/api/tasks/" + id, "DELETE");
                tasks = (await apiRequest("/api/tasks")) || [];
                renderTasks();
            } catch (err) {
                alert(err.message || "Failed to delete task.");
            }
        }

        document.getElementById("taskForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            var name = document.getElementById("taskName").value.trim();
            var due = document.getElementById("taskDue").value;
            if (!name || !due) return;
            try {
                await apiRequest("/api/tasks", "POST", { name: name, due: due });
                tasks = (await apiRequest("/api/tasks")) || [];
                renderTasks();
                this.reset();
            } catch (err) {
                alert(err.message || "Failed to add task.");
            }
        });

        init();
    </script>
</body>
</html>
