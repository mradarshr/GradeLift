<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Management - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="subjects.html"><i class="bi bi-book"></i> Subjects</a>
                <a href="timetable.html"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="quiz.html"><i class="bi bi-robot"></i> AI Quiz</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html" class="active"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <div class="top-bar">
                <div class="mb-2 mb-md-0">
                    <h4 class="fw-bold mb-0">Study Notes Vault</h4>
                    <small class="text-muted">Capture lecture notes, formulas, and concepts ready for AI quiz generation</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-warning text-dark fw-bold rounded-3" onclick="openNewNote()">
                        <i class="bi bi-plus-lg me-1"></i> New Study Note
                    </button>
                </div>
            </div>

            <div id="notesSkeleton" class="row g-3">
                <div class="col-md-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
                <div class="col-md-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
                <div class="col-md-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
            </div>

            <div id="notesList" class="row g-3 d-none"></div>
        </div>
    </div>

    <div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="noteModalTitle">New Note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="noteForm" onsubmit="event.preventDefault(); document.getElementById('saveNoteBtn').click();">
                        <input type="hidden" id="noteEditId" value="">
                        <div class="mb-3">
                            <label for="noteTitle" class="form-label fw-bold small text-muted">Title / Topic</label>
                            <input type="text" class="form-control rounded-3" id="noteTitle" placeholder="e.g. Thermodynamics Laws & Applications" required>
                        </div>
                        <div class="mb-3">
                            <label for="noteContent" class="form-label fw-bold small text-muted">Notes Content</label>
                            <textarea class="form-control rounded-3" id="noteContent" rows="7" placeholder="Write or paste your key lecture notes, definitions, theorems..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning text-dark fw-bold rounded-3 px-4" id="saveNoteBtn">
                        <i class="bi bi-check2 me-1"></i> Save Note
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let notes = [];
        let noteModal = null;

        function getNoteModal() {
            if (!noteModal) {
                noteModal = new bootstrap.Modal(document.getElementById('noteModal'));
            }
            return noteModal;
        }

        async function init() {
            await checkLogin();
            loadNotes();
        }

        async function loadNotes() {
            document.getElementById('notesSkeleton').classList.remove('d-none');
            document.getElementById('notesList').classList.add('d-none');
            hideNetworkError('notesList');

            try {
                notes = (await apiRequest('/api/notes')) || [];
                renderNotes();
            } catch (err) {
                showNetworkError('notesList', 'loadNotes()', 'Could not load your study notes from database.');
                showToast('Failed to load notes.', 'danger');
            } finally {
                document.getElementById('notesSkeleton').classList.add('d-none');
            }
        }

        function renderNotes() {
            const container = document.getElementById('notesList');
            container.innerHTML = '';

            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="p-5 text-center rounded-4 border bg-white shadow-sm">
                            <i class="bi bi-journal-plus display-4 text-warning opacity-75 mb-3 d-inline-block"></i>
                            <h5 class="fw-bold text-dark">No Notes Created Yet</h5>
                            <p class="text-muted small mx-auto mb-4" style="max-width: 440px;">Write down definitions and concepts. You can directly turn any note into an interactive GradeLift AI Quiz!</p>
                            <button class="btn btn-warning text-dark fw-bold rounded-pill px-4" onclick="openNewNote()">
                                <i class="bi bi-plus-lg me-1"></i> Create First Note
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            notes.forEach((note, i) => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';

                const card = document.createElement('div');
                card.className = 'card note-card border rounded-4 shadow-sm h-100 bg-white transition-all';

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body p-4 d-flex flex-column';

                const titleEl = document.createElement('h5');
                titleEl.className = 'card-title fw-bold text-dark mb-1 lh-sm';
                titleEl.textContent = note.title;

                const dateEl = document.createElement('p');
                dateEl.className = 'text-muted small mb-3';
                dateEl.innerHTML = `<i class="bi bi-calendar3 me-1"></i>${note.date}`;

                const contentEl = document.createElement('p');
                contentEl.className = 'card-text text-secondary mb-4 flex-grow-1';
                contentEl.style.whiteSpace = 'pre-line';
                contentEl.style.maxHeight = '140px';
                contentEl.style.overflow = 'hidden';
                contentEl.textContent = note.content || 'No text content in this note.';

                cardBody.appendChild(titleEl);
                cardBody.appendChild(dateEl);
                cardBody.appendChild(contentEl);

                const cardFooter = document.createElement('div');
                cardFooter.className = 'card-footer bg-transparent border-top pt-3 d-flex justify-content-between align-items-center';

                const quizBtn = document.createElement('a');
                quizBtn.className = 'btn btn-outline-primary btn-sm rounded-3 fw-bold';
                quizBtn.href = 'quiz.html';
                quizBtn.innerHTML = '<i class="bi bi-robot me-1"></i> AI Quiz';

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'd-flex gap-1';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-sm btn-outline-warning rounded-3';
                editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
                editBtn.setAttribute('title', 'Edit Note');
                editBtn.setAttribute('onclick', `editNote(${i})`);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-sm btn-outline-danger rounded-3';
                deleteBtn.innerHTML = '<i class="bi bi-trash"></i>';
                deleteBtn.setAttribute('title', 'Delete Note');
                deleteBtn.setAttribute('onclick', `deleteNote('${note._id}', this)`);

                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(deleteBtn);

                cardFooter.appendChild(quizBtn);
                cardFooter.appendChild(actionsDiv);

                card.appendChild(cardBody);
                card.appendChild(cardFooter);
                col.appendChild(card);
                container.appendChild(col);
            });
        }

        function openNewNote() {
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteEditId').value = '';
            document.getElementById('noteModalTitle').textContent = 'New Note';
            getNoteModal().show();
        }

        function editNote(index) {
            const note = notes[index];
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('noteEditId').value = note._id;
            document.getElementById('noteModalTitle').textContent = 'Edit Note';
            getNoteModal().show();
        }

        document.getElementById('saveNoteBtn').addEventListener('click', async function() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!title) {
                showToast('Please enter a note title.', 'warning');
                return;
            }
            const editId = document.getElementById('noteEditId').value;
            const today = new Date().toISOString().split('T')[0];
            const btn = document.getElementById('saveNoteBtn');

            setBtnLoading(btn, true, 'Saving Note...');

            try {
                if (editId === '') {
                    await apiRequest('/api/notes', 'POST', { title, content, date: today });
                    showToast('Note created successfully!', 'success');
                } else {
                    await apiRequest(`/api/notes/${editId}`, 'PUT', { title, content, date: today });
                    showToast('Note updated.', 'success');
                }
                getNoteModal().hide();
                await loadNotes();
            } catch (err) {
                showToast(err.message || 'Failed to save note.', 'danger');
            } finally {
                setBtnLoading(btn, false);
            }
        });

        async function deleteNote(id, btnEl) {
            if (!confirm('Are you sure you want to delete this note?')) return;
            if (btnEl) setBtnLoading(btnEl, true, '');
            try {
                await apiRequest(`/api/notes/${id}`, 'DELETE');
                showToast('Note deleted.', 'info');
                await loadNotes();
            } catch (err) {
                showToast('Failed to delete note.', 'danger');
                if (btnEl) setBtnLoading(btnEl, false);
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
