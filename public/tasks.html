<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Reminders - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="subjects.html"><i class="bi bi-book"></i> Subjects</a>
                <a href="timetable.html"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html" class="active"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="quiz.html"><i class="bi bi-robot"></i> AI Quiz</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <div class="top-bar">
                <div class="mb-2 mb-md-0">
                    <h4 class="fw-bold mb-0">Tasks & Assignments</h4>
                    <small class="text-muted">Stay on top of deadlines, homework, and academic deliverables</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-success rounded-3 fw-bold" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                        <i class="bi bi-plus-lg me-1"></i> Add New Task
                    </button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #7c3aed, #a78bfa);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Total Tasks</p>
                                <h3 class="fw-bold mb-0" id="statTotalTasks"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-list-check" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Pending Tasks</p>
                                <h3 class="fw-bold mb-0" id="statPendingTasks"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-hourglass-top" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Completed</p>
                                <h3 class="fw-bold mb-0" id="statCompletedTasks"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-check2-circle" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #06b6d4, #38bdf8);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Completion Rate</p>
                                <h3 class="fw-bold mb-0" id="statRate"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-pie-chart" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                    <div class="d-flex flex-wrap gap-2" id="taskFilters">
                        <button class="task-filter-pill active" onclick="setTaskFilter('all')">
                            All Tasks <span class="badge bg-white text-dark rounded-pill ms-1" id="filterCountAll"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                        <button class="task-filter-pill" onclick="setTaskFilter('pending')">
                            Pending <span class="badge bg-light text-dark rounded-pill ms-1" id="filterCountPending"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                        <button class="task-filter-pill" onclick="setTaskFilter('today')">
                            Due Today <span class="badge bg-light text-dark rounded-pill ms-1" id="filterCountToday"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                        <button class="task-filter-pill" onclick="setTaskFilter('completed')">
                            Completed <span class="badge bg-light text-dark rounded-pill ms-1" id="filterCountCompleted"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="taskSearchInput" class="form-control border-start-0" placeholder="Search tasks..." oninput="filterAndRenderTasks()">
                        </div>
                    </div>
                </div>

                <div class="progress mb-4" style="height: 6px;">
                    <div id="tasksProgressBar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;"></div>
                </div>

                <div id="taskSkeleton" class="d-flex flex-column gap-2">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                    <div class="gl-skeleton gl-skeleton-card"></div>
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>

                <div id="taskListContainer" class="d-flex flex-column gap-2 d-none"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-plus-circle text-success me-2"></i>Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="modalTaskForm" onsubmit="createTask(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Related Subject</label>
                            <select class="form-select rounded-3" id="modalTaskSubjectSelect" onchange="onTaskSubjectSelectChange()">
                                <option value="">General / No Specific Subject</option>
                                <option value="__other__">Other (Enter manually)...</option>
                            </select>
                            <div id="modalTaskCustomSubjectWrap" class="mt-2 d-none">
                                <input type="text" class="form-control rounded-3" id="modalTaskCustomSubject" placeholder="Enter custom subject name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Task Description</label>
                            <input type="text" class="form-control rounded-3" id="modalTaskName" placeholder="e.g. Complete Organic Chemistry Assignment #3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Due Date</label>
                            <input type="date" class="form-control rounded-3" id="modalTaskDue" required>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="submitTaskBtn" class="btn btn-success rounded-3 fw-bold px-4">
                            <i class="bi bi-check2 me-1"></i> Add Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let tasks = [];
        let userSubjects = [];
        let currentFilter = 'all';

        async function init() {
            await checkLogin();
            setDefaultDueDate();
            loadTasks();
        }

        function setDefaultDueDate() {
            const today = new Date().toISOString().split('T')[0];
            const dueInput = document.getElementById('modalTaskDue');
            if (dueInput) dueInput.value = today;
        }

        async function loadTasks() {
            setCountLoading('statTotalTasks', false);
            setCountLoading('statPendingTasks', false);
            setCountLoading('statCompletedTasks', false);
            setCountLoading('statRate', false);
            setCountLoading('filterCountAll', true, true);
            setCountLoading('filterCountPending', true, true);
            setCountLoading('filterCountToday', true, true);
            setCountLoading('filterCountCompleted', true, true);
            document.getElementById('taskSkeleton').classList.remove('d-none');
            document.getElementById('taskListContainer').classList.add('d-none');
            hideNetworkError('taskListContainer');

            try {
                const [tasksRes, subsRes] = await Promise.all([
                    apiRequest('/api/tasks'),
                    apiRequest('/api/subjects').catch(function() { return []; })
                ]);
                tasks = tasksRes || [];
                userSubjects = subsRes || [];
                populateTaskSubjectSelect();
                updateMetrics();
                filterAndRenderTasks();
            } catch (err) {
                showNetworkError('taskListContainer', 'loadTasks()', 'Could not load your tasks from the database.');
                showToast('Failed to load tasks.', 'danger');
            } finally {
                document.getElementById('taskSkeleton').classList.add('d-none');
            }
        }

        function populateTaskSubjectSelect() {
            const select = document.getElementById('modalTaskSubjectSelect');
            if (!select) return;
            select.innerHTML = '<option value="">General / No Specific Subject</option>';

            userSubjects.forEach(function(s) {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name + (s.code ? ' (' + s.code + ')' : '');
                select.appendChild(opt);
            });

            const otherOpt = document.createElement('option');
            otherOpt.value = '__other__';
            otherOpt.textContent = 'Other (Enter manually)...';
            select.appendChild(otherOpt);
        }

        function onTaskSubjectSelectChange() {
            const select = document.getElementById('modalTaskSubjectSelect');
            const wrap = document.getElementById('modalTaskCustomSubjectWrap');
            const input = document.getElementById('modalTaskCustomSubject');
            if (select.value === '__other__') {
                wrap.classList.remove('d-none');
                input.focus();
            } else {
                wrap.classList.add('d-none');
            }
        }

        function updateMetrics() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.done).length;
            const pending = total - completed;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            const today = new Date().toISOString().split('T')[0];
            const dueToday = tasks.filter(t => !t.done && t.due === today).length;

            document.getElementById('statTotalTasks').textContent = total;
            document.getElementById('statPendingTasks').textContent = pending;
            document.getElementById('statCompletedTasks').textContent = completed;
            document.getElementById('statRate').textContent = `${rate}%`;

            document.getElementById('tasksProgressBar').style.width = `${rate}%`;

            document.getElementById('filterCountAll').textContent = total;
            document.getElementById('filterCountPending').textContent = pending;
            document.getElementById('filterCountToday').textContent = dueToday;
            document.getElementById('filterCountCompleted').textContent = completed;
        }

        function setTaskFilter(filterName) {
            currentFilter = filterName;
            const pills = document.querySelectorAll('.task-filter-pill');
            pills.forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
            filterAndRenderTasks();
        }

        function filterAndRenderTasks() {
            const search = (document.getElementById('taskSearchInput').value || '').toLowerCase().trim();
            const today = new Date().toISOString().split('T')[0];

            let filtered = tasks.slice();

            if (currentFilter === 'pending') {
                filtered = filtered.filter(t => !t.done);
            } else if (currentFilter === 'completed') {
                filtered = filtered.filter(t => t.done);
            } else if (currentFilter === 'today') {
                filtered = filtered.filter(t => !t.done && t.due === today);
            }

            if (search) {
                filtered = filtered.filter(t => (t.name || '').toLowerCase().includes(search) || (t.subject || '').toLowerCase().includes(search));
            }

            filtered.sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return (a.due || '').localeCompare(b.due || '');
            });

            const container = document.getElementById('taskListContainer');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-5 text-center rounded-4 border bg-light">
                        <i class="bi bi-check2-all display-4 text-success opacity-50 mb-3 d-inline-block"></i>
                        <h5 class="fw-bold text-dark">No Tasks Found</h5>
                        <p class="text-muted small mx-auto mb-3" style="max-width: 420px;">
                            ${currentFilter === 'completed' ? 'No completed tasks yet. Finish pending assignments to see them here!' : 'All clear! Click Add New Task to organize your study agenda.'}
                        </p>
                        <button class="btn btn-success rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                            <i class="bi bi-plus-lg me-1"></i> Add Task
                        </button>
                    </div>
                `;
                return;
            }

            filtered.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-modern-item ${task.done ? 'task-done' : ''}`;

                const isOverdue = !task.done && task.due < today;
                const isDueToday = !task.done && task.due === today;

                let dueBadge = '';
                if (task.done) {
                    dueBadge = '<span class="badge bg-success-subtle text-success small px-2 py-1"><i class="bi bi-check2-circle me-1"></i>Finished</span>';
                } else if (isOverdue) {
                    dueBadge = '<span class="badge bg-danger-subtle text-danger small px-2 py-1 pulse-badge"><i class="bi bi-exclamation-triangle-fill me-1"></i>Overdue</span>';
                } else if (isDueToday) {
                    dueBadge = '<span class="badge bg-warning-subtle text-warning small px-2 py-1"><i class="bi bi-alarm me-1"></i>Due Today</span>';
                } else {
                    const daysLeft = Math.ceil((new Date(task.due) - new Date(today)) / (1000 * 60 * 60 * 24));
                    dueBadge = `<span class="badge bg-light text-secondary small px-2 py-1"><i class="bi bi-calendar3 me-1"></i>In ${daysLeft}d (${task.due})</span>`;
                }

                let subjectBadge = '';
                if (task.subject) {
                    const matchedSub = userSubjects.find(s => (s.name || '').toLowerCase() === (task.subject || '').toLowerCase());
                    const subColor = matchedSub && matchedSub.color ? matchedSub.color : '#7c3aed';
                    subjectBadge = '<span class="badge rounded-pill small" style="background: ' + subColor + '18; color: ' + subColor + '; font-weight: 700;"><i class="bi bi-book me-1"></i>' + escapeHtml(task.subject) + '</span>';
                }

                item.innerHTML = `
                    <div class="d-flex align-items-center gap-3 flex-grow-1">
                        <div class="task-checkbox-custom" onclick="toggleTaskStatus('${task._id}', ${!task.done}, this)" title="${task.done ? 'Mark pending' : 'Mark completed'}">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="task-title-text">${escapeHtml(task.name)}</div>
                            <div class="d-flex align-items-center gap-2 mt-1 flex-wrap">
                                ${subjectBadge}
                                ${dueBadge}
                            </div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm ${task.done ? 'btn-outline-secondary' : 'btn-outline-success'} rounded-3" onclick="toggleTaskStatus('${task._id}', ${!task.done}, this)" title="${task.done ? 'Undo completion' : 'Complete task'}">
                            <i class="bi ${task.done ? 'bi-arrow-counterclockwise' : 'bi-check2'}"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger rounded-3" onclick="deleteTaskItem('${task._id}', this)" title="Delete Task">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function createTask(e) {
            e.preventDefault();
            const btn = document.getElementById('submitTaskBtn');
            const name = document.getElementById('modalTaskName').value.trim();
            const due = document.getElementById('modalTaskDue').value;
            const select = document.getElementById('modalTaskSubjectSelect');
            let subject = select.value === '__other__'
                ? document.getElementById('modalTaskCustomSubject').value.trim()
                : select.value;

            if (!name || !due) return;

            setBtnLoading(btn, true, 'Creating Task...');

            try {
                await apiRequest('/api/tasks', 'POST', { name, due, subject });
                showToast('Task added successfully!', 'success');
                document.getElementById('modalTaskForm').reset();
                populateTaskSubjectSelect();
                setDefaultDueDate();
                setDefaultDueDate();

                const modalEl = document.getElementById('addTaskModal');
                const m = bootstrap.Modal.getOrCreateInstance(modalEl);
                m.hide();

                await loadTasks();
            } catch (err) {
                showToast(err.message || 'Failed to add task.', 'danger');
            } finally {
                setBtnLoading(btn, false);
            }
        }

        async function toggleTaskStatus(id, newStatus, btnEl) {
            if (btnEl) setBtnLoading(btnEl, true, '');
            try {
                await apiRequest(`/api/tasks/${id}`, 'PUT', { done: newStatus });
                showToast(newStatus ? 'Task marked complete! Great job 🎉' : 'Task marked as pending.', 'info');
                await loadTasks();
            } catch (err) {
                showToast('Failed to update task status.', 'danger');
                if (btnEl) setBtnLoading(btnEl, false);
            }
        }

        async function deleteTaskItem(id, btnEl) {
            if (!confirm('Are you sure you want to remove this task?')) return;
            if (btnEl) setBtnLoading(btnEl, true, '');
            try {
                await apiRequest(`/api/tasks/${id}`, 'DELETE');
                showToast('Task deleted.', 'info');
                await loadTasks();
            } catch (err) {
                showToast('Failed to delete task.', 'danger');
                if (btnEl) setBtnLoading(btnEl, false);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
