<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timetable - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="subjects.html"><i class="bi bi-book"></i> Subjects</a>
                <a href="timetable.html" class="active"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="quiz.html"><i class="bi bi-robot"></i> AI Quiz</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <div class="top-bar">
                <div class="mb-2 mb-md-0">
                    <h4 class="fw-bold mb-0">Weekly Timetable</h4>
                    <small class="text-muted">Plan your classes, lectures, and revision blocks seamlessly</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-primary rounded-3 fw-bold" data-bs-toggle="modal" data-bs-target="#addSlotModal">
                        <i class="bi bi-plus-lg me-1"></i> Add Class Slot
                    </button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4 col-sm-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #7c3aed, #a78bfa);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Weekly Slots</p>
                                <h3 class="fw-bold mb-0" id="statWeeklySlots"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-calendar3" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #06b6d4, #38bdf8);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Today's Classes</p>
                                <h3 class="fw-bold mb-0" id="statTodaySlots"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-clock-history" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-12">
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Active Days</p>
                                <h3 class="fw-bold mb-0" id="statActiveDays"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-check2-circle" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 bg-white mb-4">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <h6 class="fw-bold text-dark mb-0"><i class="bi bi-funnel me-1 text-primary"></i> Filter by Day</h6>
                    <small class="text-muted" id="filterCountLabel">Showing all slots</small>
                </div>
                <div class="d-flex flex-wrap gap-2" id="dayFilterTabs">
                    <button class="day-pill-filter active" onclick="setDayFilter('All')">
                        <i class="bi bi-grid-fill"></i> All Days <span class="badge bg-white text-primary rounded-pill ms-1" id="badgeAll"><span class="count-spinner-dark count-spinner-sm"></span></span>
                    </button>
                    <button class="day-pill-filter" onclick="setDayFilter('Monday')">Mon <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeMon"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Tuesday')">Tue <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeTue"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Wednesday')">Wed <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeWed"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Thursday')">Thu <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeThu"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Friday')">Fri <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeFri"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Saturday')">Sat <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeSat"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                    <button class="day-pill-filter" onclick="setDayFilter('Sunday')">Sun <span class="badge bg-light text-dark rounded-pill ms-1" id="badgeSun"><span class="count-spinner-dark count-spinner-sm"></span></span></button>
                </div>
            </div>

            <div id="timetableSkeleton" class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
                <div class="col-md-6 col-lg-4">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>
            </div>

            <div id="timetableGrid" class="row g-3 d-none"></div>
        </div>
    </div>

    <div class="modal fade" id="addSlotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-calendar-plus text-primary me-2"></i>Add Schedule Slot</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addSlotForm" onsubmit="addSlot(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Day of Week</label>
                            <select class="form-select rounded-3" id="slotDay" required>
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="Saturday">Saturday</option>
                                <option value="Sunday">Sunday</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Class / Session Time</label>
                            <input type="time" class="form-control rounded-3" id="slotTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Course Subject</label>
                            <select class="form-select rounded-3" id="slotSubjectSelect" onchange="onSlotSubjectSelectChange()">
                                <option value="">-- Choose enrolled subject --</option>
                                <option value="__other__">Other (Enter manually)...</option>
                            </select>
                            <div id="slotCustomSubjectWrap" class="mt-2 d-none">
                                <input type="text" class="form-control rounded-3" id="slotCustomSubject" placeholder="Enter custom subject or class title (e.g. Physics Lab, Seminar)">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="submitSlotBtn" class="btn btn-primary rounded-3 fw-bold px-4">
                            <i class="bi bi-check2 me-1"></i> Save Slot
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let timetable = [];
        let userSubjects = [];
        let currentDayFilter = 'All';
        let addSlotModalInstance = null;

        const dayOrder = {
            'Monday': 1, 'Tuesday': 2, 'Wednesday': 3, 'Thursday': 4,
            'Friday': 5, 'Saturday': 6, 'Sunday': 7
        };

        const dayColorMap = {
            'Monday': '#7c3aed',
            'Tuesday': '#3b82f6',
            'Wednesday': '#06b6d4',
            'Thursday': '#10b981',
            'Friday': '#f59e0b',
            'Saturday': '#ec4899',
            'Sunday': '#8b5cf6'
        };

        async function init() {
            await checkLogin();
            loadTimetable();
        }

        async function loadTimetable() {
            setCountLoading('statWeeklySlots', false);
            setCountLoading('statTodaySlots', false);
            setCountLoading('statActiveDays', false);
            ['badgeAll', 'badgeMon', 'badgeTue', 'badgeWed', 'badgeThu', 'badgeFri', 'badgeSat', 'badgeSun'].forEach(function(id) {
                setCountLoading(id, true, true);
            });
            document.getElementById('timetableSkeleton').classList.remove('d-none');
            document.getElementById('timetableGrid').classList.add('d-none');
            hideNetworkError('timetableGrid');

            try {
                const [slots, subs] = await Promise.all([
                    apiRequest('/api/timetable'),
                    apiRequest('/api/subjects').catch(function() { return []; })
                ]);
                timetable = slots || [];
                userSubjects = subs || [];
                populateSlotSubjectSelect();
                updateStats();
                renderCards();
            } catch (err) {
                showNetworkError('timetableGrid', 'loadTimetable()', 'Could not load timetable schedule from database.');
                showToast('Failed to load timetable.', 'danger');
            } finally {
                document.getElementById('timetableSkeleton').classList.add('d-none');
            }
        }

        function populateSlotSubjectSelect() {
            const select = document.getElementById('slotSubjectSelect');
            if (!select) return;
            select.innerHTML = '';

            if (userSubjects.length > 0) {
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = '-- Choose enrolled subject --';
                select.appendChild(defaultOpt);

                userSubjects.forEach(function(s) {
                    const opt = document.createElement('option');
                    opt.value = s.name;
                    opt.textContent = s.name + (s.code ? ' (' + s.code + ')' : '');
                    select.appendChild(opt);
                });

                const otherOpt = document.createElement('option');
                otherOpt.value = '__other__';
                otherOpt.textContent = 'Other (Enter manually)...';
                select.appendChild(otherOpt);

                select.value = userSubjects[0].name;
                document.getElementById('slotCustomSubjectWrap').classList.add('d-none');
            } else {
                const otherOpt = document.createElement('option');
                otherOpt.value = '__other__';
                otherOpt.textContent = 'Other (Enter manually)...';
                select.appendChild(otherOpt);
                select.value = '__other__';
                document.getElementById('slotCustomSubjectWrap').classList.remove('d-none');
            }
        }

        function onSlotSubjectSelectChange() {
            const select = document.getElementById('slotSubjectSelect');
            const wrap = document.getElementById('slotCustomSubjectWrap');
            const input = document.getElementById('slotCustomSubject');
            if (select.value === '__other__' || !select.value) {
                wrap.classList.remove('d-none');
                input.focus();
            } else {
                wrap.classList.add('d-none');
            }
        }

        function updateStats() {
            document.getElementById('statWeeklySlots').textContent = timetable.length;
            document.getElementById('badgeAll').textContent = timetable.length;

            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const dayCounts = {};
            days.forEach(d => dayCounts[d] = 0);

            timetable.forEach(s => {
                if (dayCounts[s.day] !== undefined) dayCounts[s.day]++;
            });

            document.getElementById('badgeMon').textContent = dayCounts['Monday'];
            document.getElementById('badgeTue').textContent = dayCounts['Tuesday'];
            document.getElementById('badgeWed').textContent = dayCounts['Wednesday'];
            document.getElementById('badgeThu').textContent = dayCounts['Thursday'];
            document.getElementById('badgeFri').textContent = dayCounts['Friday'];
            document.getElementById('badgeSat').textContent = dayCounts['Saturday'];
            document.getElementById('badgeSun').textContent = dayCounts['Sunday'];

            const activeDaysCount = Object.values(dayCounts).filter(c => c > 0).length;
            document.getElementById('statActiveDays').textContent = `${activeDaysCount} / 7`;

            const todayName = days[(new Date().getDay() + 6) % 7];
            document.getElementById('statTodaySlots').textContent = dayCounts[todayName] || 0;
        }

        function setDayFilter(day) {
            currentDayFilter = day;
            const buttons = document.querySelectorAll('.day-pill-filter');
            buttons.forEach(btn => btn.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById('filterCountLabel').textContent = day === 'All' ? 'Showing all weekly slots' : `Showing ${day} classes`;
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('timetableGrid');
            container.innerHTML = '';

            let filtered = timetable.slice();
            if (currentDayFilter !== 'All') {
                filtered = filtered.filter(s => s.day === currentDayFilter);
            }

            filtered.sort((a, b) => {
                const diff = (dayOrder[a.day] || 99) - (dayOrder[b.day] || 99);
                if (diff !== 0) return diff;
                return (a.time || '').localeCompare(b.time || '');
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="p-5 text-center rounded-4 border bg-white shadow-sm">
                            <i class="bi bi-calendar-x display-4 text-primary opacity-50 mb-3 d-inline-block"></i>
                            <h5 class="fw-bold text-dark">No Classes Scheduled ${currentDayFilter === 'All' ? 'Yet' : `for ${currentDayFilter}`}</h5>
                            <p class="text-muted small mx-auto mb-4" style="max-width: 440px;">Keep your semester organized by adding class lectures, labs, or scheduled revision blocks.</p>
                            <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addSlotModal">
                                <i class="bi bi-plus-lg me-1"></i> Add Class Slot
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            filtered.forEach(function(slot) {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';

                const matchedSub = userSubjects.find(function(s) {
                    return (s.name || '').toLowerCase() === (slot.subject || '').toLowerCase();
                });
                const borderCol = matchedSub && matchedSub.color ? matchedSub.color : (dayColorMap[slot.day] || '#7c3aed');

                col.innerHTML = `
                    <div class="timetable-card-modern" style="border-left-color: ${borderCol};">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge rounded-pill" style="background: ${borderCol}18; color: ${borderCol}; font-weight: 700;">
                                ${slot.day}
                            </span>
                            <span class="time-slot-badge">
                                <i class="bi bi-clock"></i> ${formatTime(slot.time)}
                            </span>
                        </div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <h5 class="fw-bold text-dark mb-0 lh-sm">${escapeHtml(slot.subject)}</h5>
                            ${matchedSub && matchedSub.code ? `<span class="badge bg-light text-secondary border small">${escapeHtml(matchedSub.code)}</span>` : ''}
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <small class="text-muted"><i class="bi bi-mortarboard me-1"></i>${matchedSub && matchedSub.instructor ? escapeHtml(matchedSub.instructor) : 'Class Session'}</small>
                            <button class="btn btn-sm btn-outline-danger rounded-3" onclick="deleteSlot('${slot._id}', this)" title="Delete Slot">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function formatTime(t) {
            if (!t) return '';
            const parts = t.split(':');
            if (parts.length < 2) return t;
            let h = parseInt(parts[0], 10);
            const m = parts[1];
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            if (h === 0) h = 12;
            return `${h}:${m} ${ampm}`;
        }

        async function addSlot(e) {
            e.preventDefault();
            const btn = document.getElementById('submitSlotBtn');
            const day = document.getElementById('slotDay').value;
            const time = document.getElementById('slotTime').value;
            const select = document.getElementById('slotSubjectSelect');
            let subject = select.value === '__other__'
                ? document.getElementById('slotCustomSubject').value.trim()
                : select.value;
            if (!subject) {
                subject = document.getElementById('slotCustomSubject').value.trim();
            }

            if (!day || !time || !subject) {
                showToast('Please select or enter a subject.', 'warning');
                return;
            }

            setBtnLoading(btn, true, 'Saving Slot...');

            try {
                await apiRequest('/api/timetable', 'POST', { day, time, subject });
                showToast('Class slot added to schedule!', 'success');
                document.getElementById('addSlotForm').reset();
                populateSlotSubjectSelect();

                if (!addSlotModalInstance) {
                    addSlotModalInstance = bootstrap.Modal.getInstance(document.getElementById('addSlotModal'));
                }
                if (addSlotModalInstance) {
                    addSlotModalInstance.hide();
                } else {
                    const el = document.getElementById('addSlotModal');
                    const m = bootstrap.Modal.getOrCreateInstance(el);
                    m.hide();
                }

                await loadTimetable();
            } catch (err) {
                showToast(err.message || 'Failed to add slot.', 'danger');
            } finally {
                setBtnLoading(btn, false);
            }
        }

        async function deleteSlot(id, btnEl) {
            if (!confirm('Are you sure you want to delete this schedule slot?')) return;
            if (btnEl) setBtnLoading(btnEl, true, '');
            try {
                await apiRequest(`/api/timetable/${id}`, 'DELETE');
                showToast('Slot removed from timetable.', 'info');
                await loadTimetable();
            } catch (err) {
                showToast('Failed to delete slot.', 'danger');
                if (btnEl) setBtnLoading(btnEl, false);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
