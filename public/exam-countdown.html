<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Countdown - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="subjects.html"><i class="bi bi-book"></i> Subjects</a>
                <a href="timetable.html"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="quiz.html"><i class="bi bi-robot"></i> AI Quiz</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html" class="active"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <div class="top-bar">
                <div class="mb-2 mb-md-0">
                    <h4 class="fw-bold mb-0">Exam Countdown</h4>
                    <small class="text-muted">Track deadlines, midterms, and finals with precision live countdowns</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-primary rounded-3 fw-bold" data-bs-toggle="modal" data-bs-target="#addExamModal">
                        <i class="bi bi-plus-lg me-1"></i> Add Exam Date
                    </button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4 col-sm-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #ef4444, #f87171);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Urgent Exams (&lt; 14d)</p>
                                <h3 class="fw-bold mb-0" id="statUrgentExams"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-bell-fill" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="stat-card" style="background: linear-gradient(135deg, #7c3aed, #a78bfa);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Upcoming Total</p>
                                <h3 class="fw-bold mb-0" id="statUpcomingTotal"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-calendar-event" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-12">
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="mb-1" style="opacity: 0.8; font-size: 0.8rem;">Concluded Exams</p>
                                <h3 class="fw-bold mb-0" id="statCompletedExams"><span class="count-spinner"></span></h3>
                            </div>
                            <i class="bi bi-trophy-fill" style="font-size: 1.8rem; opacity: 0.4;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div class="d-flex flex-wrap gap-2" id="examFilterTabs">
                        <button class="day-pill-filter active" onclick="setExamFilter('all')">
                            All Exams <span class="badge bg-white text-dark rounded-pill ms-1" id="filterCountAll"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                        <button class="day-pill-filter" onclick="setExamFilter('upcoming')">
                            Upcoming <span class="badge bg-light text-dark rounded-pill ms-1" id="filterCountUpcoming"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                        <button class="day-pill-filter" onclick="setExamFilter('past')">
                            Completed <span class="badge bg-light text-dark rounded-pill ms-1" id="filterCountPast"><span class="count-spinner-dark count-spinner-sm"></span></span>
                        </button>
                    </div>

                    <a href="quiz.html" class="btn btn-sm btn-outline-primary rounded-pill">
                        <i class="bi bi-robot me-1"></i> Practice with AI Quiz
                    </a>
                </div>

                <div id="examSkeleton" class="d-flex flex-column gap-3">
                    <div class="gl-skeleton gl-skeleton-card"></div>
                    <div class="gl-skeleton gl-skeleton-card"></div>
                </div>

                <div id="examListContainer" class="d-flex flex-column gap-3 d-none"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addExamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-calendar-plus text-primary me-2"></i>Schedule Exam</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addExamForm" onsubmit="createExam(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Course Subject</label>
                            <select class="form-select rounded-3" id="examSubjectSelect" onchange="onExamSubjectSelectChange()">
                                <option value="">General / Choose Enrolled Subject</option>
                                <option value="__other__">Other (Enter manually)...</option>
                            </select>
                            <div id="examCustomSubjectWrap" class="mt-2 d-none">
                                <input type="text" class="form-control rounded-3" id="examCustomSubject" placeholder="Enter custom subject name">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Exam Name / Title</label>
                            <input type="text" class="form-control rounded-3" id="examNameInput" placeholder="e.g. Midterm II, Final Examination" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Exam Date</label>
                            <input type="date" class="form-control rounded-3" id="examDateInput" required>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="submitExamBtn" class="btn btn-primary rounded-3 fw-bold px-4">
                            <i class="bi bi-check2 me-1"></i> Save Exam
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let exams = [];
        let userSubjects = [];
        let currentFilter = 'all';
        let tickerInterval = null;

        async function init() {
            await checkLogin();
            setDefaultExamDate();
            loadExams();
            if (tickerInterval) clearInterval(tickerInterval);
            tickerInterval = setInterval(updateAllTickers, 1000);
        }

        function setDefaultExamDate() {
            const dateInput = document.getElementById('examDateInput');
            if (dateInput) {
                const nextWeek = new Date();
                nextWeek.setDate(nextWeek.getDate() + 14);
                dateInput.value = nextWeek.toISOString().split('T')[0];
            }
        }

        async function loadExams() {
            setCountLoading('statUrgentExams', false);
            setCountLoading('statUpcomingTotal', false);
            setCountLoading('statCompletedExams', false);
            ['filterCountAll', 'filterCountUpcoming', 'filterCountPast'].forEach(function(id) {
                setCountLoading(id, true, true);
            });
            document.getElementById('examSkeleton').classList.remove('d-none');
            document.getElementById('examListContainer').classList.add('d-none');
            hideNetworkError('examListContainer');

            try {
                const [examsRes, subsRes] = await Promise.all([
                    apiRequest('/api/exams'),
                    apiRequest('/api/subjects').catch(function() { return []; })
                ]);
                exams = examsRes || [];
                userSubjects = subsRes || [];
                populateExamSubjectSelect();
                updateStats();
                renderExamCards();
            } catch (err) {
                showNetworkError('examListContainer', 'loadExams()', 'Could not load your exams from the database.');
                showToast('Failed to load exams.', 'danger');
            } finally {
                document.getElementById('examSkeleton').classList.add('d-none');
            }
        }

        function populateExamSubjectSelect() {
            const select = document.getElementById('examSubjectSelect');
            if (!select) return;
            select.innerHTML = '<option value="">General / Choose Enrolled Subject</option>';

            userSubjects.forEach(function(s) {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name + (s.code ? ' (' + s.code + ')' : '');
                select.appendChild(opt);
            });

            const otherOpt = document.createElement('option');
            otherOpt.value = '__other__';
            otherOpt.textContent = 'Other (Enter manually)...';
            select.appendChild(otherOpt);
        }

        function onExamSubjectSelectChange() {
            const select = document.getElementById('examSubjectSelect');
            const wrap = document.getElementById('examCustomSubjectWrap');
            const input = document.getElementById('examCustomSubject');
            const nameInput = document.getElementById('examNameInput');
            if (select.value === '__other__') {
                wrap.classList.remove('d-none');
                input.focus();
            } else {
                wrap.classList.add('d-none');
                if (select.value && (!nameInput.value || nameInput.value.includes('Exam') || nameInput.value.includes('Final'))) {
                    nameInput.value = select.value + ' Final Exam';
                }
            }
        }

        function updateStats() {
            const now = new Date().getTime();
            let urgent = 0;
            let upcoming = 0;
            let completed = 0;

            exams.forEach(e => {
                const target = getExamTime(e.date);
                const diff = target - now;
                if (diff <= 0) {
                    completed++;
                } else {
                    upcoming++;
                    const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    if (daysLeft <= 14) urgent++;
                }
            });

            document.getElementById('statUrgentExams').textContent = urgent;
            document.getElementById('statUpcomingTotal').textContent = upcoming;
            document.getElementById('statCompletedExams').textContent = completed;

            document.getElementById('filterCountAll').textContent = exams.length;
            document.getElementById('filterCountUpcoming').textContent = upcoming;
            document.getElementById('filterCountPast').textContent = completed;
        }

        function setExamFilter(filterName) {
            currentFilter = filterName;
            const buttons = document.querySelectorAll('#examFilterTabs .day-pill-filter');
            buttons.forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderExamCards();
        }

        function getExamTime(dateStr) {
            if (!dateStr) return 0;
            const isoStr = dateStr + (dateStr.length === 10 ? 'T09:00:00' : '');
            let d = new Date(isoStr);
            if (isNaN(d.getTime())) d = new Date(dateStr);
            return d.getTime();
        }

        function renderExamCards() {
            const container = document.getElementById('examListContainer');
            container.innerHTML = '';
            const now = new Date().getTime();

            let filtered = exams.slice();
            if (currentFilter === 'upcoming') {
                filtered = filtered.filter(e => getExamTime(e.date) > now);
            } else if (currentFilter === 'past') {
                filtered = filtered.filter(e => getExamTime(e.date) <= now);
            }

            filtered.sort((a, b) => getExamTime(a.date) - getExamTime(b.date));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-5 text-center rounded-4 border bg-light">
                        <i class="bi bi-calendar-check display-4 text-primary opacity-50 mb-3 d-inline-block"></i>
                        <h5 class="fw-bold text-dark">No Exams in this Category</h5>
                        <p class="text-muted small mx-auto mb-3" style="max-width: 440px;">Stay prepared and prevent surprises by adding all your test and midterm dates in advance.</p>
                        <button class="btn btn-primary rounded-pill px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#addExamModal">
                            <i class="bi bi-plus-lg me-1"></i> Add Exam Date
                        </button>
                    </div>
                `;
                return;
            }

            filtered.forEach(exam => {
                const targetTime = getExamTime(exam.date);
                const diff = targetTime - now;
                const isOver = diff <= 0;
                const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                const isUrgent = !isOver && daysLeft <= 7;

                let urgencyBadge = '';
                if (isOver) {
                    urgencyBadge = '<span class="badge bg-success-subtle text-success small px-2 py-1"><i class="bi bi-check-all me-1"></i>Concluded</span>';
                } else if (isUrgent) {
                    urgencyBadge = '<span class="badge bg-danger text-white small px-2 py-1 pulse-badge"><i class="bi bi-fire me-1"></i>Urgent: &lt; 7 Days</span>';
                } else if (daysLeft <= 14) {
                    urgencyBadge = '<span class="badge bg-warning-subtle text-warning small px-2 py-1"><i class="bi bi-clock-history me-1"></i>Coming Up Soon</span>';
                } else {
                    urgencyBadge = '<span class="badge bg-light text-secondary small px-2 py-1"><i class="bi bi-calendar-event me-1"></i>Scheduled</span>';
                }

                let subjectBadge = '';
                let matchedSub = null;
                if (exam.subject) {
                    matchedSub = userSubjects.find(s => (s.name || '').toLowerCase() === (exam.subject || '').toLowerCase());
                    const subColor = matchedSub && matchedSub.color ? matchedSub.color : '#7c3aed';
                    subjectBadge = '<span class="badge rounded-pill me-2 small" style="background: ' + subColor + '18; color: ' + subColor + '; font-weight: 700;"><i class="bi bi-book me-1"></i>' + escapeHtml(exam.subject) + '</span>';
                }

                const card = document.createElement('div');
                card.className = `exam-card-modern ${isUrgent ? 'exam-urgent' : ''}`;
                if (!isUrgent && matchedSub && matchedSub.color) {
                    card.style.borderLeftColor = matchedSub.color;
                }
                card.dataset.targetTime = targetTime;

                card.innerHTML = `
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                                ${urgencyBadge}
                                ${subjectBadge}
                                <small class="text-muted"><i class="bi bi-calendar3 me-1"></i>${exam.date}</small>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">${escapeHtml(exam.name)}</h5>
                            <small class="text-muted">${matchedSub && matchedSub.code ? escapeHtml(matchedSub.code) + ' • ' : ''}Target Exam Milestone</small>
                        </div>

                        <div class="ticker-grid" id="ticker-${exam._id}">
                            ${getTickerHtml(diff)}
                        </div>

                        <div class="d-flex gap-2">
                            <a href="quiz.html" class="btn btn-sm btn-outline-primary rounded-3" title="Practice AI Quiz for this exam">
                                <i class="bi bi-robot"></i> Practice
                            </a>
                            <button class="btn btn-sm btn-outline-danger rounded-3" onclick="deleteExamItem('${exam._id}', this)" title="Delete Exam">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getTickerHtml(diff) {
            if (diff <= 0) {
                return `
                    <div class="ticker-box" style="min-width: 140px; background: #ecfdf5; border-color: #a7f3d0;">
                        <span class="ticker-num text-success" style="font-size: 1.1rem;"><i class="bi bi-check-circle me-1"></i>Completed</span>
                        <span class="ticker-lbl text-success">Finished</span>
                    </div>
                `;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            return `
                <div class="ticker-box">
                    <span class="ticker-num">${days}</span>
                    <span class="ticker-lbl">Days</span>
                </div>
                <div class="ticker-box">
                    <span class="ticker-num">${String(hours).padStart(2, '0')}</span>
                    <span class="ticker-lbl">Hours</span>
                </div>
                <div class="ticker-box">
                    <span class="ticker-num">${String(mins).padStart(2, '0')}</span>
                    <span class="ticker-lbl">Mins</span>
                </div>
                <div class="ticker-box">
                    <span class="ticker-num text-primary">${String(secs).padStart(2, '0')}</span>
                    <span class="ticker-lbl">Secs</span>
                </div>
            `;
        }

        function updateAllTickers() {
            const now = new Date().getTime();
            exams.forEach(exam => {
                const el = document.getElementById(`ticker-${exam._id}`);
                if (el) {
                    const target = getExamTime(exam.date);
                    const diff = target - now;
                    el.innerHTML = getTickerHtml(diff);
                }
            });
        }

        async function createExam(e) {
            e.preventDefault();
            const btn = document.getElementById('submitExamBtn');
            const name = document.getElementById('examNameInput').value.trim();
            const date = document.getElementById('examDateInput').value;
            const select = document.getElementById('examSubjectSelect');
            let subject = select.value === '__other__'
                ? document.getElementById('examCustomSubject').value.trim()
                : select.value;

            if (!name || !date) return;

            setBtnLoading(btn, true, 'Scheduling Exam...');

            try {
                await apiRequest('/api/exams', 'POST', { name, date, subject });
                showToast('Exam scheduled successfully!', 'success');
                document.getElementById('addExamForm').reset();
                populateExamSubjectSelect();
                setDefaultExamDate();

                const modalEl = document.getElementById('addExamModal');
                const m = bootstrap.Modal.getOrCreateInstance(modalEl);
                m.hide();

                await loadExams();
            } catch (err) {
                showToast(err.message || 'Failed to add exam.', 'danger');
            } finally {
                setBtnLoading(btn, false);
            }
        }

        async function deleteExamItem(id, btnEl) {
            if (!confirm('Are you sure you want to remove this exam countdown?')) return;
            if (btnEl) setBtnLoading(btnEl, true, '');
            try {
                await apiRequest(`/api/exams/${id}`, 'DELETE');
                showToast('Exam removed.', 'info');
                await loadExams();
            } catch (err) {
                showToast('Failed to delete exam.', 'danger');
                if (btnEl) setBtnLoading(btnEl, false);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
