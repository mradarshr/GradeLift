<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Countdown - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="timetable.html"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html" class="active"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <h4 class="fw-bold mb-4"><i class="bi bi-hourglass-split text-secondary"></i> Exam Countdown</h4>

            <div class="chart-card p-3 p-md-4 mb-4">
                <form id="examForm" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control" id="examName" placeholder="Exam name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="date" class="form-control" id="examDate" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-plus-lg"></i> Add Exam</button>
                    </div>
                </form>
            </div>

            <div id="examList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        var exams = [];

        async function init() {
            await checkLogin();
            exams = (await apiRequest("/api/exams")) || [];
            renderExams();
            setInterval(renderExams, 1000);
        }

        function renderExams() {
            var examList = document.getElementById('examList');
            examList.innerHTML = '';
            var now = new Date().getTime();

            for (var i = 0; i < exams.length; i++) {
                var exam = exams[i];
                var examDateStr = exam.date + (exam.date.length === 10 ? 'T00:00:00' : '');
                var targetDate = new Date(examDateStr);
                if (isNaN(targetDate.getTime())) {
                    targetDate = new Date(exam.date);
                }
                var diff = targetDate.getTime() - now;

                var card = document.createElement('div');
                if (diff <= 0) {
                    card.className = 'card countdown-card exam-over shadow-sm mb-3';
                } else {
                    card.className = 'card countdown-card shadow-sm mb-3';
                }

                var cardBody = document.createElement('div');
                cardBody.className = 'card-body d-flex justify-content-between align-items-center';

                var left = document.createElement('div');
                var h5 = document.createElement('h5');
                h5.className = 'mb-1';
                h5.textContent = exam.name;

                var p = document.createElement('p');
                p.className = 'text-muted mb-0';
                p.textContent = exam.date;

                left.appendChild(h5);
                left.appendChild(p);

                var right = document.createElement('div');
                right.className = 'd-flex align-items-center gap-3';

                if (diff <= 0) {
                    var badge = document.createElement('span');
                    badge.className = 'badge bg-danger fs-6';
                    badge.textContent = 'Exam Over';
                    right.appendChild(badge);
                } else {
                    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    var seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    var countdownSpan = document.createElement('span');
                    countdownSpan.className = 'fw-bold text-secondary';
                    countdownSpan.textContent = days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's';
                    right.appendChild(countdownSpan);
                }

                var deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-outline-danger btn-sm';
                deleteBtn.innerHTML = '<i class="bi bi-trash"></i>';
                deleteBtn.setAttribute('onclick', 'deleteExam(\'' + exam._id + '\')');

                right.appendChild(deleteBtn);

                cardBody.appendChild(left);
                cardBody.appendChild(right);
                card.appendChild(cardBody);
                examList.appendChild(card);
            }
        }

        async function deleteExam(id) {
            try {
                await apiRequest("/api/exams/" + id, "DELETE");
                exams = (await apiRequest("/api/exams")) || [];
                renderExams();
            } catch (err) {
                alert(err.message || "Failed to delete exam.");
            }
        }

        document.getElementById('examForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var name = document.getElementById('examName').value.trim();
            var date = document.getElementById('examDate').value;
            if (!name || !date) {
                return;
            }

            try {
                await apiRequest("/api/exams", "POST", { name: name, date: date });
                exams = (await apiRequest("/api/exams")) || [];
                renderExams();
                document.getElementById('examForm').reset();
            } catch (err) {
                alert(err.message || "Failed to add exam.");
            }
        });

        init();
    </script>
</body>
</html>
