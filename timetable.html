<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timetable - GradeLift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-header d-lg-none">
        <button class="btn btn-link text-dark p-0 me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-2"></i></button>
        <span class="fw-bold fs-5 text-primary"><i class="bi bi-rocket-takeoff"></i> GradeLift</span>
    </div>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="d-flex">
        <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="sidebar-brand p-0 mb-0">
                    <i class="bi bi-rocket-takeoff"></i> GradeLift
                </div>
                <button type="button" class="btn-close d-lg-none" onclick="toggleSidebar()"></button>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="timetable.html" class="active"><i class="bi bi-calendar-week"></i> Timetable</a>
                <a href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a>
                <a href="pomodoro.html"><i class="bi bi-stopwatch"></i> Pomodoro</a>
                <a href="progress.html"><i class="bi bi-bar-chart-line"></i> Progress</a>
                <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
                <a href="exam-countdown.html"><i class="bi bi-hourglass-split"></i> Exams</a>
            </nav>
            <div class="sidebar-nav mt-auto">
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <div class="main-content flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h4 class="fw-bold mb-0"><i class="bi bi-calendar-week text-primary"></i> Study Timetable</h4>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSlotModal">
                    <i class="bi bi-plus-lg"></i> Add Slot
                </button>
            </div>

            <div class="chart-card p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Subject</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="timetableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addSlotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Slot</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addSlotForm" onsubmit="addSlot(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="slotDay" class="form-label">Day</label>
                            <select class="form-select" id="slotDay" required>
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="Saturday">Saturday</option>
                                <option value="Sunday">Sunday</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="slotTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="slotTime" required>
                        </div>
                        <div class="mb-3">
                            <label for="slotSubject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="slotSubject" placeholder="Subject name" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        var timetable = [];

        async function init() {
            await checkLogin();
            timetable = (await apiRequest("/api/timetable")) || [];
            renderTable();
        }

        function renderTable() {
            var tbody = document.getElementById("timetableBody");
            tbody.innerHTML = "";

            var dayOrder = {
                "Monday": 1,
                "Tuesday": 2,
                "Wednesday": 3,
                "Thursday": 4,
                "Friday": 5,
                "Saturday": 6,
                "Sunday": 7
            };

            timetable.sort(function(a, b) {
                var dayDiff = (dayOrder[a.day] || 99) - (dayOrder[b.day] || 99);
                if (dayDiff !== 0) {
                    return dayDiff;
                }
                return a.time.localeCompare(b.time);
            });

            for (var i = 0; i < timetable.length; i++) {
                var slot = timetable[i];
                var tr = document.createElement("tr");

                var tdDay = document.createElement("td");
                tdDay.textContent = slot.day;
                tr.appendChild(tdDay);

                var tdTime = document.createElement("td");
                tdTime.textContent = slot.time;
                tr.appendChild(tdTime);

                var tdSubject = document.createElement("td");
                tdSubject.textContent = slot.subject;
                tr.appendChild(tdSubject);

                var tdAction = document.createElement("td");
                tdAction.innerHTML = '<button class="btn btn-sm btn-danger" onclick="deleteSlot(\'' + slot._id + '\')"><i class="bi bi-trash"></i> Delete</button>';
                tr.appendChild(tdAction);

                tbody.appendChild(tr);
            }
        }

        async function addSlot(event) {
            if (event) {
                event.preventDefault();
            }
            var day = document.getElementById("slotDay").value;
            var time = document.getElementById("slotTime").value;
            var subject = document.getElementById("slotSubject").value;

            if (!day || !time || !subject) {
                return;
            }

            try {
                await apiRequest("/api/timetable", "POST", {
                    day: day,
                    time: time,
                    subject: subject.trim()
                });
                timetable = (await apiRequest("/api/timetable")) || [];
                renderTable();

                document.getElementById("addSlotForm").reset();

                var modalElement = document.getElementById("addSlotModal");
                var modal = bootstrap.Modal.getInstance(modalElement);
                if (!modal) {
                    modal = new bootstrap.Modal(modalElement);
                }
                modal.hide();
            } catch (err) {
                alert(err.message || "Failed to add slot.");
            }
        }

        async function deleteSlot(id) {
            try {
                await apiRequest("/api/timetable/" + id, "DELETE");
                timetable = (await apiRequest("/api/timetable")) || [];
                renderTable();
            } catch (err) {
                alert(err.message || "Failed to delete slot.");
            }
        }

        init();
    </script>
</body>
</html>
